version: 2.1
orbs:
  browser-tools: circleci/browser-tools@1.4.8

jobs:
  build:
    docker:
      - image: cimg/php:8.2-browsers

    steps:
      - checkout

      - browser-tools/install-browser-tools

      - run:
          name: "Set Up Environment"
          command: |
            sudo apt-get update
            sudo apt-get install -y php-sqlite3 php-mbstring php-xml php-zip
            mkdir -p storage/logs
            sudo chmod -R 0777 storage bootstrap/cache
            mv .env.testing .env
            php artisan key:generate
            touch database/database.sqlite

      - restore_cache:
          keys:
            - composer-v1-{{ checksum "composer.lock" }}
            - composer-v1-

      - run:
          name: "Install Dependencies"
          command: composer install --no-interaction --prefer-dist

      - save_cache:
          key: composer-v1-{{ checksum "composer.lock" }}
          paths:
            - vendor

      - run:
          name: "Run Migrations"
          command: php artisan migrate --env=testing --force

      - run:
          name: "Run PHPUnit Tests"
          command: ./vendor/bin/phpunit

      - run:
          name: "Install Laravel Dusk"
          command: |
            composer require --dev laravel/dusk
            php artisan dusk:update --detect

      - run:
          name: "Start Server and Run Dusk Tests"
          command: |
            php -d display_errors=On -d error_reporting=E_ALL artisan serve --host=127.0.0.1 --port=8000 --env=testing &
            sleep 5
            php artisan dusk

      - run:
          name: "Show Laravel Logs"
          when: always
          command: |
            if [ -f storage/logs/laravel.log ]; then
              echo "Contents of storage/logs/laravel.log:"
              cat storage/logs/laravel.log
            else
              echo "No Laravel logs found."
            fi
